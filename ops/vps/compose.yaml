name: kat-team-events
services:
  web:
    image: kat-team-events:${KAT_RELEASE:?Set KAT_RELEASE}
    container_name: kat-team-events
    restart: unless-stopped
    ports:
      - '127.0.0.1:3103:80'
    networks: [coolify]
    volumes:
      - /opt/kat-team-events/shared/booking-config.php:/run/secrets/booking-config.php:ro
      - /opt/kat-team-events/shared/msmtprc:/run/secrets/msmtprc:ro
    mem_limit: 256m
    cpus: 0.5
    security_opt: ['no-new-privileges:true']
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
networks:
  coolify:
    external: true
